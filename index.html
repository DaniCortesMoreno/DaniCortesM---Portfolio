<!DOCTYPE html>
<html lang="es" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dani Cortés Moreno — Full-Stack Developer &amp; UI/UX Designer</title>
    <meta name="description" content="Portfolio profesional de Dani Cortés Moreno. Soluciones web de alto rendimiento, arquitectura limpia, diseño specular y desarrollo Full-Stack con React, TypeScript, Node.js y ecosistema WordPress." />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta name="keywords" content="Dani Cortés, Full-Stack Developer, UI/UX Designer, React, TypeScript, Alcoy, Portfolio Web" />
    
    <!-- OpenGraph / Social Meta -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Dani Cortés Moreno — Full-Stack Developer &amp; UI/UX Designer" />
    <meta property="og:description" content="Desarrollador Full-Stack y Diseñador UI/UX especializado en interfaces táctiles de alta velocidad y arquitecturas web robustas." />
    <meta property="og:image" content="/screen.webp" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Preload Critical LCP Hero Image -->
    <link rel="preload" as="image" href="/keyboard.webp" type="image/webp" fetchpriority="high" />

    <!-- Prefetch CV in background so opening it is instantaneous -->
    <link rel="prefetch" href="/Daniel_Cortes_Moreno_CV.pdf" as="document" />

    <!-- Google Fonts Optimization: DNS Prefetch + Preconnect + Display Swap -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" />
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
